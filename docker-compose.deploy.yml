services:
  frontend:
    image: registry.gitlab.com/e-vinci/cae-projects/2025-cae-projects/cae-group-09/frontend-prod:latest # Remplacer par l'image Docker de votre frontend
    container_name: frontend-prod
    ports:
      - 5172:5172
    depends_on:
      - api

  api:
    image: registry.gitlab.com/e-vinci/cae-projects/2025-cae-projects/cae-group-09/api-prod:latest # Remplacer par l'image Docker de votre API
    container_name: api-prod
    ports:
      - 3000:3000
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    entrypoint: ["java", "-jar", "app.jar", "--spring.profiles.active=staging"]

  db:
    image: postgres:latest
    container_name: db-test
    environment:
      POSTGRES_DB: cae_db
      POSTGRES_USER: cae_user
      POSTGRES_PASSWORD: cae
    ports:
      - "5432:5432"
      
  reverse-proxy:
    image: registry.gitlab.com/e-vinci/cae-projects/2025-cae-projects/cae-group-09/reverse-proxy-prod:latest # Remplacer par l'image Docker de votre reverse proxy
    container_name: reverse-proxy-prod
    ports:
      - 80:80