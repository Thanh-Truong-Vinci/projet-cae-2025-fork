openapi: 3.1.0
info:
  title: CAE demo API
  description: API de démonstration pour le CAE
  version: 1.0.0
servers:
  - url: 'http://localhost:3000'
paths:
  /auths/login:
    post:
      summary: Connexion
      description: Connexion d'un utilisateur
      requestBody:
        required: true
        description: Identifiants de connexion
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Requête mal formée
        '401':
          description: Identifiants incorrects

  /auths/register:
    post:
      summary: Inscription
      description: Inscription d'un utilisateur
      requestBody:
        required: true
        description: Identifiants de l'utilisateur
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRegister'
      responses:
        '200':
          description: Inscription réussie, renvoie un token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Requête mal formée
        '409':
          description: Utilisateur déjà existant

  /auths/me:
    post:
      summary: Rafraîchir le token
      description: Rafraîchissement du token JWT
      requestBody:
        required: true
        description: Token à vérifier
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token rafraîchi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: Token invalide

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Credentials:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password
    CredentialsRegister:
      type: object
      properties:
        nom:
          type: string
          example: User
        prenom:
          type: string
          example: Example
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password
        rue:
          type: string
          example: User Street
        numeroRue:
          type: string
          example: 1
        codePostal:
          type: string
          example: 1000
        commune:
          type: string
          example: User City
        pays:
          type: string
          example: User Country
        tel:
          type: string
          example: 123456789
    AuthenticatedUser:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6InVzZXJAZXhhbXBsZS5jb20iLCJpYXQiOjE1MTYyMzkwMjJ9.4TJok9J
    TokenRequest:
      type: object
      properties:
        token:
          type: string